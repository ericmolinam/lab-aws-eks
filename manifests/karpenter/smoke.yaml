apiVersion: v1
kind: Namespace
metadata:
  name: karpenter-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demand
  namespace: karpenter-smoke
spec:
  replicas: 0
  selector:
    matchLabels:
      app: karpenter-smoke
  template:
    metadata:
      labels:
        app: karpenter-smoke
    spec:
      nodeSelector:
        karpenter.sh/nodepool: lab
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 256Mi
