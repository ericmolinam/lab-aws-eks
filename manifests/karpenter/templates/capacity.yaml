apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: lab
spec:
  role: {{ .Values.nodeRole | quote }}
  amiSelectorTerms:
    - alias: al2023@v20261003
  subnetSelectorTerms:
  {{- range .Values.subnetIds }}
    - id: {{ . | quote }}
  {{- end }}
  securityGroupSelectorTerms:
    - id: {{ .Values.securityGroupId | quote }}
  associatePublicIPAddress: false
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  tags:
    Name: {{ printf "%s-karpenter" .Values.clusterName | quote }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: lab
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: lab
      expireAfter: Never
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [{{ .Values.capacityType | quote }}]
        - key: topology.kubernetes.io/zone
          operator: In
          values: {{ .Values.zones | toJson }}
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: {{ .Values.instanceFamilies | toJson }}
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: {{ .Values.instanceSizes | toJson }}
  limits:
    cpu: {{ .Values.cpuLimit | quote }}
    memory: {{ .Values.memoryLimit | quote }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: {{ .Values.consolidateAfter | quote }}
    budgets:
      - nodes: "1"
